<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetLine — client-server chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ============ JOIN SCREEN ============ -->
  <section id="join-screen" class="join-screen">
    <div class="join-card">
      <div class="join-mark">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <h1>NetLine</h1>
      <p class="join-sub">A small client-server chat network. Pick a name and a channel to open a connection.</p>

      <label class="field">
        <span>Display name</span>
        <input id="username-input" type="text" maxlength="24" placeholder="e.g. river" autocomplete="off" />
      </label>

      <label class="field">
        <span>Channel</span>
        <select id="room-select">
          {% for r in rooms %}
          <option value="{{ r }}">#{{ r }}</option>
          {% endfor %}
        </select>
      </label>

      <button id="join-btn" class="btn-primary">Connect</button>
      <p id="join-error" class="join-error" hidden></p>
    </div>
  </section>

  <!-- ============ CHAT SCREEN ============ -->
  <section id="chat-screen" class="chat-screen" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-dot"></span> NetLine
      </div>

      <div class="sidebar-block">
        <h2>Channels</h2>
        <ul id="room-list" class="room-list">
          {% for r in rooms %}
          <li data-room="{{ r }}" class="room-item">#{{ r }}</li>
          {% endfor %}
        </ul>
      </div>

      <div class="sidebar-block">
        <h2>Online — <span id="roster-count">0</span></h2>
        <ul id="roster-list" class="roster-list"></ul>
      </div>

      <div class="conn-status">
        <span id="conn-dot" class="conn-dot"></span>
        <span id="conn-label">connecting…</span>
      </div>
    </aside>

    <main class="main">
      <header class="chat-header">
        <div>
          <div class="chat-title">#<span id="current-room">general</span></div>
          <div class="chat-meta">socket session <span id="session-id">—</span></div>
        </div>
        <div class="me-badge">signed in as <strong id="me-name"></strong></div>
      </header>

      <div id="log" class="log"></div>

      <div id="typing-strip" class="typing-strip" hidden></div>

      <form id="composer" class="composer" autocomplete="off">
        <input id="message-input" type="text" maxlength="2000" placeholder="Message #general" />
        <button type="submit" class="btn-send" aria-label="Send">Send</button>
      </form>
    </main>
  </section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
